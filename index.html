<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d12" />
    <meta name="description" content="Blitle identity gateway preview." />
    <title>Identity Gateway | Blitle</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #080d12;
        --panel: rgba(16, 26, 34, 0.72);
        --line: rgba(187, 219, 228, 0.14);
        --muted: #8798a2;
        --text: #edf5f5;
        --cyan: #8ce8df;
        --lime: #d6f77a;
        --danger: #ff9d9d;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 15% 15%, rgba(28, 116, 123, 0.19), transparent 38%),
          radial-gradient(ellipse at 86% 80%, rgba(129, 151, 77, 0.12), transparent 33%),
          linear-gradient(145deg, #080d12 4%, #0d151c 54%, #0a1116 100%);
        color: var(--text);
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        background-image:
          linear-gradient(rgba(180, 215, 220, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(180, 215, 220, 0.035) 1px, transparent 1px);
        background-size: 52px 52px;
        content: "";
        mask-image: linear-gradient(to bottom, #000 0%, transparent 92%);
        pointer-events: none;
      }

      .ambient {
        position: fixed;
        z-index: 0;
        width: 42vw;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(140, 232, 223, 0.34), transparent);
        transform: rotate(-36deg);
        pointer-events: none;
      }

      .ambient-one { top: 24%; left: -10%; }
      .ambient-two { right: -10%; bottom: 22%; transform: rotate(-36deg); opacity: 0.55; }

      .page {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 22px;
      }

      .topbar, .card, .footnote { width: min(100%, 430px); }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        padding: 0 2px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid rgba(140, 232, 223, 0.35);
        color: var(--cyan);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 0;
        box-shadow: inset 0 0 18px rgba(140, 232, 223, 0.07);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #9aabb1;
        font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 11px rgba(214, 247, 122, 0.8);
        content: "";
      }

      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(195, 223, 229, 0.17);
        background: var(--panel);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.46), inset 0 1px rgba(255, 255, 255, 0.055);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        transition: border-color 220ms ease, transform 220ms ease, box-shadow 220ms ease;
        animation: enter 560ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(140, 232, 223, 0.3);
        box-shadow: 0 34px 100px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.07);
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 52px;
        padding: 0 26px;
        border-bottom: 1px solid var(--line);
        color: #a8b8bd;
        font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .serial { color: #61727a; letter-spacing: 0.06em; }
      .card-body { padding: 30px 30px 25px; }

      .eyebrow {
        margin: 0 0 13px;
        color: var(--cyan);
        font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(29px, 8vw, 36px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.12;
      }

      .intro {
        margin: 10px 0 27px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .field { display: block; margin-top: 17px; }

      .field-label {
        display: block;
        margin-bottom: 8px;
        color: #c4d0d2;
        font-size: 11px;
        font-weight: 600;
      }

      .field input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid rgba(188, 217, 222, 0.15);
        border-radius: 2px;
        outline: none;
        background: rgba(6, 12, 17, 0.56);
        color: var(--text);
        font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .field input::placeholder { color: #596970; }
      .field input:focus { border-color: rgba(140, 232, 223, 0.65); background: rgba(6, 12, 17, 0.76); box-shadow: 0 0 0 3px rgba(140, 232, 223, 0.09); }

      .authenticate {
        display: flex;
        width: 100%;
        height: 49px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 25px;
        border: 1px solid rgba(214, 247, 122, 0.75);
        border-radius: 2px;
        background: linear-gradient(110deg, #d6f77a, #b9e9a2);
        color: #111b1c;
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: transform 180ms ease, filter 180ms ease, box-shadow 180ms ease;
      }

      .authenticate:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 7px 24px rgba(182, 226, 131, 0.15); }
      .authenticate:active { transform: translateY(0); }
      .authenticate:focus-visible, .copy-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
      .authenticate:disabled { cursor: wait; filter: saturate(0.75); }

      .arrow { font-size: 17px; font-weight: 400; line-height: 1; }

      .message {
        min-height: 20px;
        margin: 12px 0 0;
        color: transparent;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        transition: color 180ms ease;
      }

      .message.error { color: var(--danger); }
      .message.loading { color: var(--cyan); }

      .copy-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 8px;
        padding-top: 19px;
        border-top: 1px solid var(--line);
      }

      .copy-description { min-width: 0; }
      .copy-title { display: block; color: #d5dfdf; font-size: 11px; font-weight: 600; }
      .copy-value { display: block; margin-top: 5px; color: #778a90; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }

      .copy-button {
        display: inline-flex;
        min-height: 36px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 11px;
        border: 1px solid rgba(140, 232, 223, 0.25);
        border-radius: 2px;
        background: rgba(140, 232, 223, 0.055);
        color: var(--cyan);
        cursor: pointer;
        font-size: 10px;
        font-weight: 650;
        transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .copy-button:hover { transform: translateY(-1px); border-color: rgba(140, 232, 223, 0.6); background: rgba(140, 232, 223, 0.11); }
      .copy-icon { font-size: 14px; line-height: 1; }

      .footnote {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        padding: 0 2px;
        color: #62727a;
        font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .toast {
        position: fixed;
        z-index: 5;
        right: 22px;
        bottom: 22px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 15px;
        border: 1px solid rgba(140, 232, 223, 0.3);
        background: rgba(13, 24, 29, 0.94);
        color: var(--text);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.show { opacity: 1; transform: translateY(0); }
      .toast-mark { color: var(--lime); }

      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(17, 27, 28, 0.25);
        border-top-color: #111b1c;
        border-radius: 50%;
        animation: spin 650ms linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 480px) {
        .page { justify-content: center; padding: 22px 16px; }
        .card-head { padding-inline: 20px; }
        .card-body { padding: 25px 20px 20px; }
        .topbar { margin-bottom: 13px; }
        .status { font-size: 9px; }
        .toast { right: 16px; bottom: 16px; left: 16px; justify-content: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Blitle home">
          <span class="brand-mark" aria-hidden="true">B</span>
          BLITLE<span style="color: var(--cyan)">/</span>
        </a>
        <span class="status">Preview build</span>
      </header>

      <section class="card" aria-labelledby="page-title">
        <div class="card-head">
          <span>Identity gateway</span>
          <span class="serial">BLT—01 / 2026</span>
        </div>

        <div class="card-body">
          <p class="eyebrow">Secure access protocol</p>
          <h1 id="page-title">Enter your<br />private channel<span style="color: var(--cyan)">.</span></h1>
          <p class="intro">Authenticate to reconnect with your Blitle workspace.</p>

          <form id="login-form">
            <label class="field">
              <span class="field-label">Identity / Username</span>
              <input name="identity" type="text" placeholder="Enter your identity" autocomplete="username" required />
            </label>

            <label class="field">
              <span class="field-label">Security Key / Password</span>
              <input name="security-key" type="password" placeholder="Enter your security key" autocomplete="current-password" required />
            </label>

            <button class="authenticate" id="authenticate-button" type="submit">
              <span id="button-label">Authenticate</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <p class="message" id="auth-message" aria-live="polite"></p>
          </form>

          <div class="copy-row">
            <div class="copy-description">
              <span class="copy-title">Public ID</span>
              <span class="copy-value">hello</span>
            </div>
            <button class="copy-button" id="copy-button" type="button">
              <span class="copy-icon" aria-hidden="true">▢</span>
              Copy Public ID
            </button>
          </div>
        </div>
      </section>

      <footer class="footnote">
        <span>Demo environment</span>
        <span>Authentication unavailable</span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-mark" aria-hidden="true">✓</span>
      <span id="toast-message">Copied!</span>
    </div>

    <script>
      const loginForm = document.querySelector('#login-form');
      const authenticateButton = document.querySelector('#authenticate-button');
      const buttonLabel = document.querySelector('#button-label');
      const authMessage = document.querySelector('#auth-message');
      const copyButton = document.querySelector('#copy-button');
      const toast = document.querySelector('#toast');
      const toastMessage = document.querySelector('#toast-message');
      let toastTimeout;

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (authenticateButton.disabled) return;

        authenticateButton.disabled = true;
        authMessage.className = 'message loading';
        authMessage.textContent = 'Verifying credentials...';
        buttonLabel.innerHTML = '<span class="spinner" aria-hidden="true"></span>';

        window.setTimeout(() => {
          authMessage.className = 'message error';
          authMessage.textContent = 'Access Denied: Invalid Security Token';
          buttonLabel.textContent = 'Authenticate';
          authenticateButton.disabled = false;
        }, 850);
      });

      function showToast(message) {
        toastMessage.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(toastTimeout);
        toastTimeout = window.setTimeout(() => toast.classList.remove('show'), 1900);
      }

      class ClipboardAction {
        constructor({ action, target, text, trigger, emitter }) {
          this.action = action;
          this.target = target;
          this.text = text;
          this.trigger = trigger;
          this.emitter = emitter;
          this.copy();
        }

        async copy() {
          try {
            if (this.action !== 'copy') throw new Error('Unsupported clipboard action');
            await navigator.clipboard.writeText(this.text);
            this.emitter.onCopySuccess();
          } catch {
            this.emitter.onCopyFailure();
          }
        }
      }

      class ClipboardController {
        onCopySuccess() {
          showToast('Copied!');
        }

        onCopyFailure() {
          showToast('Clipboard unavailable');
        }

        copy(text) {
          if (this.clipboardAction) {
            this.clipboardAction = null;
          }

          this.clipboardAction = new ClipboardAction({
            action: 'copy',
            target: undefined,
            text: text,
            trigger: undefined,
            emitter: this
          });
        }
      }

      const clipboard = new ClipboardController();
      copyButton.addEventListener('click', () => clipboard.copy('bc1q8kxhjyp7lx639tqj9pp2mtn4tyllkg99da3shf'));
    </script>
  </body>
</html>
